# Builds the desktop downloads and publishes them as a GitHub Release.
#
# Push a tag to release:   git tag v0.1.0 && git push origin v0.1.0
#
# The files always have the same names, so the website can link to
# https://github.com/<owner>/<repo>/releases/latest/download/<file>.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # builds the files without releasing, to try them out

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -t .

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: Pendu-Windows.exe
          - os: macos-latest       # Apple silicon
            asset: Pendu-macOS.zip
          - os: ubuntu-22.04       # older glibc, so the binary runs on more distros
            asset: Pendu-Linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libtk8.6

      - name: Install PyInstaller
        run: |
          python -c "import tkinter; print('Tk', tkinter.TkVersion)"
          python -m pip install --upgrade pip pyinstaller

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name Pendu pendu.pyw
          Move-Item dist/Pendu.exe ${{ matrix.asset }}

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --name Pendu \
            --osx-bundle-identifier com.pendu.reminder pendu.pyw
          ditto -c -k --keepParent dist/Pendu.app ${{ matrix.asset }}

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconfirm --onefile --name pendu pendu.pyw
          tar -czf ${{ matrix.asset }} -C dist pendu

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" files/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Pendu $GITHUB_REF_NAME" \
            --generate-notes
